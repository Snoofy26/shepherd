name: Release

on:
  push:
    branches: [ "patched" ]
    # Publish semver tags as releases.
    #tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the cosign tool
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.1.2

      # https://github.com/docker/setup-buildx-action
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      # https://github.com/docker/login-action
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      
      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAME }}
            ${{ env.IMAGE_NAME }}
            tags: |
              type=ref,event=branch
              type=sha

      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: >
          echo "${{ steps.meta.outputs.tags }}" | xargs -I {}
          cosign sign --yes {}@${{ steps.build-and-push.outputs.digest }}

      - name: Verify the signature of the published Docker image
        env:
          IDENTITY: "https://github.com/Snoofy26/shepherd/.github/workflows/release.yml@.*"
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: >
          echo "${{ steps.meta.outputs.tags }}" | xargs -I {}
          cosign verify {}@${{ steps.build-and-push.outputs.digest }}
          --certificate-identity-regexp=$IDENTITY --certificate-oidc-issuer=$OIDC_ISSUER
