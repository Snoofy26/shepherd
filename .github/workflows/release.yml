name: Release

on:
  push:
    branches: [ "patched" ]
    # Publish semver tags as releases.
    #tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  # github.repository as <account>/<repo>
  IMAGE_OWNER: snoofy26
  IMAGE_REPO: ${{ github.event.repository.name }}


jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the cosign tool
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.1.2

      # https://github.com/docker/setup-buildx-action
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      # https://github.com/docker/login-action
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Sign the published Docker image
        env:
          IMAGE: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}
        run: |
          cosign sign --yes \
            "${IMAGE}@${{ steps.build-and-push.outputs.digest }}"
      
      - name: Verify the signature of the published Docker image
        env:
          IMAGE: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}
          IDENTITY: "https://github.com/Snoofy26/shepherd/.github/workflows/release.yml@.*"
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          cosign verify \
            "${IMAGE}@${{ steps.build-and-push.outputs.digest }}" \
            --certificate-identity-regexp="$IDENTITY" \
            --certificate-oidc-issuer="$OIDC_ISSUER"
